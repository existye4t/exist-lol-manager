name: Upstream Sync Check

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: Check for upstream updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      upstream_version: ${{ steps.get_upstream_version.outputs.version }}
      current_version: ${{ steps.get_current_version.outputs.version }}
      has_update: ${{ steps.compare_versions.outputs.has_update }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/LeagueToolkit/ltk-manager.git || true
          git fetch upstream --tags --prune

      - name: Get current Exist LTK version
        id: get_current_version
        run: |
          # Extract version from src-tauri/Cargo.toml
          VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current Exist LTK version: $VERSION"

      - name: Get latest upstream LTK release
        id: get_upstream_version
        run: |
          # Get the latest release tag from upstream
          UPSTREAM_VERSION=$(gh release list --repo LeagueToolkit/ltk-manager --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_VERSION" ]; then
            # Fallback: get latest tag
            UPSTREAM_VERSION=$(git ls-remote --tags --sort=-v:refname upstream | head -1 | cut -d/ -f3)
          fi
          echo "version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "Latest upstream LTK version: $UPSTREAM_VERSION"

      - name: Compare versions
        id: compare_versions
        run: |
          CURRENT="${{ steps.get_current_version.outputs.version }}"
          UPSTREAM="${{ steps.get_upstream_version.outputs.version }}"
          
          # Remove 'v' prefix if present for comparison
          CURRENT_CLEAN=${CURRENT#v}
          UPSTREAM_CLEAN=${UPSTREAM#v}
          
          if [ "$CURRENT_CLEAN" = "$UPSTREAM_CLEAN" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "Versions match: $CURRENT_CLEAN = $UPSTREAM_CLEAN"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "Update available: $CURRENT_CLEAN -> $UPSTREAM_CLEAN"
          fi

      - name: Exit if no update
        if: ${{ steps.compare_versions.outputs.has_update == 'false' }}
        run: |
          echo "No upstream update needed"
          exit 0

      - name: Create sync branch
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          BRANCH_NAME="upstream-sync/${UPSTREAM_VERSION}"
          
          # Check if branch already exists
          if git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
            echo "Branch $BRANCH_NAME already exists, switching to it"
            git checkout $BRANCH_NAME
          else
            git checkout -b $BRANCH_NAME
          fi

      - name: Checkout upstream release tag
        id: checkout_release
        if: ${{ steps.compare_versions.outputs.has_update == 'true' }}
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          
          # Checkout the specific release tag instead of main
          # This ensures we only sync the stable released version
          git checkout -b upstream-sync/${UPSTREAM_VERSION} ${UPSTREAM_VERSION} || {
            echo "Failed to checkout tag ${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "checked_out=true" >> $GITHUB_OUTPUT

      - name: Merge upstream release into sync branch
        id: merge
        if: ${{ steps.checkout_release.outputs.checked_out == 'true' }}
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          
          # Create sync branch from current HEAD
          git checkout -b upstream-sync/${UPSTREAM_VERSION} || {
            git checkout upstream-sync/${UPSTREAM_VERSION}
          }
          
          # Merge the checked-out release tag
          git merge ${UPSTREAM_VERSION} --no-edit -m "chore: sync LTK upstream to ${UPSTREAM_VERSION}" || {
            echo "conflicts=true" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflicts detected - manual resolution required"
            exit 0
          }
          echo "conflicts=false" >> $GITHUB_OUTPUT

      - name: Update Exist version references
        if: ${{ steps.merge.outputs.conflicts != 'true' }}
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          
          # Update version in src-tauri/Cargo.toml if it changed
          CURRENT_VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          UPSTREAM_CLEAN=${UPSTREAM_VERSION#v}
          
          if [ "$CURRENT_VERSION" != "$UPSTREAM_CLEAN" ]; then
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$UPSTREAM_CLEAN\"/" src-tauri/Cargo.toml
            echo "Updated src-tauri/Cargo.toml version: $CURRENT_VERSION -> $UPSTREAM_CLEAN"
          fi
          
          # Update version in package.json if it changed
          PKG_CURRENT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PKG_CURRENT_VERSION" != "$UPSTREAM_CLEAN" ]; then
            sed -i "s/\"version\": \"$PKG_CURRENT_VERSION\"/\"version\": \"$UPSTREAM_CLEAN\"/" package.json
            echo "Updated package.json version: $PKG_CURRENT_VERSION -> $UPSTREAM_CLEAN"
          fi

      - name: Run Rust validation checks
        if: ${{ steps.merge.outputs.conflicts != 'true' }}
        run: |
          # Run Rust validation checks
          echo "Running Rust validation checks..."
          
          # Check cargo formatting
          cargo fmt --check
          
          # Check cargo compiles
          cargo check --workspace
          
          # Run tests
          cargo test --workspace

      - name: Run frontend validation checks
        if: ${{ steps.merge.outputs.conflicts != 'true' }}
        run: |
          # Run frontend validation checks
          echo "Running frontend validation checks..."
          
          # Install dependencies
          pnpm install --frozen-lockfile
          
          # Type check
          pnpm typecheck
          
          # Build
          pnpm build
          
          # Lint
          pnpm lint
          
          # Test
          pnpm test

      - name: Push sync branch
        if: ${{ steps.merge.outputs.conflicts != 'true' }}
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          BRANCH_NAME="upstream-sync/${UPSTREAM_VERSION}"
          
          git push origin $BRANCH_NAME --force

      - name: Create or update PR
        if: ${{ steps.merge.outputs.conflicts != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream-sync/${{ steps.get_upstream_version.outputs.version }}
          base: exist-lol-manager
          title: "chore: sync LTK upstream to ${{ steps.get_upstream_version.outputs.version }}"
          body: |
            ## Upstream Sync
            
            **Upstream:** LeagueToolkit/ltk-manager
            
            **Previous LTK version:** ${{ steps.get_current_version.outputs.version }}
            
            **New LTK version:** ${{ steps.get_upstream_version.outputs.version }}
            
            ## Changes
            - Synced upstream LTK changes to ${{ steps.get_upstream_version.outputs.version }}
            - Updated version references
            
            ## Validation
            - [ ] cargo fmt --check
            - [ ] cargo check --workspace
            - [ ] cargo test --workspace
            - [ ] pnpm install --frozen-lockfile
            - [ ] pnpm typecheck
            - [ ] pnpm build
            - [ ] pnpm lint
            - [ ] pnpm test
            
            ## Conflicts
            None (automatic merge successful)
            
            ---
            *This PR was created automatically by the upstream sync workflow.*

      - name: Handle merge conflicts
        if: ${{ steps.merge.outputs.conflicts == 'true' }}
        run: |
          echo "Merge conflicts detected - PR creation skipped"
          echo "Manual resolution required"
          exit 1

  notify:
    name: Notify on failure
    needs: check-upstream
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync failed: ${{ github.workflow }}',
              body: `The upstream sync workflow failed. Please check the workflow run for details.\n\nRun: ${github.server_url}/${github.repository}/actions/runs/${github.run_id}`,
              labels: ['upstream-sync', 'failure']
            })