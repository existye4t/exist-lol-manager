name: Upstream Sync & Auto Release

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if version matches or release exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: LeagueToolkit/ltk-manager
  EXIST_REPO: existye4t/exist-lol-manager
  DEFAULT_BRANCH: exist-lol-manager

jobs:
  check-upstream:
    name: Check for upstream updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upstream_version: ${{ steps.get_upstream_version.outputs.version }}
      current_version: ${{ steps.get_current_version.outputs.version }}
      has_update: ${{ steps.compare_versions.outputs.has_update }}
      release_tag: ${{ steps.get_upstream_version.outputs.release_tag }}
      is_stable: ${{ steps.get_upstream_version.outputs.is_stable }}
      force_sync: ${{ steps.compare_versions.outputs.force_sync }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/LeagueToolkit/ltk-manager.git || true
          git fetch upstream --tags --prune --force

      - name: Get current Exist LTK version
        id: get_current_version
        run: |
          VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current Exist LTK version: $VERSION"

      - name: Get latest upstream LTK release
        id: get_upstream_version
        run: |
          # Get the latest stable release from upstream (not pre-release, not draft)
          # gh release list returns oldest first, so use [-1] for latest
          echo "Attempting gh release list..."
          UPSTREAM_RELEASE=$(gh release list --repo LeagueToolkit/ltk-manager --limit 10 --json tagName,isDraft,isPrerelease --jq 'map(select(.isDraft == false and .isPrerelease == false)) | .[-1].tagName // empty' 2>/dev/null || echo "")
          echo "gh release list result: '$UPSTREAM_RELEASE'"
          
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "gh release list returned empty, trying GitHub API via curl..."
            # Use GitHub API directly (works without auth for public repos)
            UPSTREAM_RELEASE=$(curl -s "https://api.github.com/repos/LeagueToolkit/ltk-manager/releases" | jq -r 'map(select(.draft == false and .prerelease == false)) | .[0].tag_name // empty' 2>/dev/null || echo "")
            echo "GitHub API result: '$UPSTREAM_RELEASE'"
          fi
          
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "API failed, trying git ls-remote fallback..."
            # Fallback: get latest stable tag from upstream remote
            git fetch upstream --tags --prune --force 2>/dev/null || true
            UPSTREAM_RELEASE=$(git ls-remote --tags --sort=-v:refname upstream 2>/dev/null | grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | cut -d/ -f3 || echo "")
            echo "git ls-remote result: '$UPSTREAM_RELEASE'"
          fi
          
          # Determine if it's a stable release (not alpha/beta/rc)
          IS_STABLE="false"
          if echo "$UPSTREAM_RELEASE" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            IS_STABLE="true"
          fi
          
          echo "version=$UPSTREAM_RELEASE" >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT
          echo "Latest upstream LTK version: $UPSTREAM_RELEASE (stable: $IS_STABLE)"

      - name: Compare versions
        id: compare_versions
        run: |
          CURRENT="${{ steps.get_current_version.outputs.version }}"
          UPSTREAM="${{ steps.get_upstream_version.outputs.version }}"
          IS_STABLE="${{ steps.get_upstream_version.outputs.is_stable }}"
          FORCE="${{ github.event.inputs.force }}"
          
          echo "FORCE=$FORCE"
          echo ""
          if [ "$IS_STABLE" != "true" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "force_sync=false" >> $GITHUB_OUTPUT
            echo "Upstream version is not a stable release: $UPSTREAM"
            exit 0
          fi
          
          # Remove 'v' prefix if present for comparison
          CURRENT_CLEAN=${CURRENT#v}
          UPSTREAM_CLEAN=${UPSTREAM#v}
          
          # Check if force mode is enabled
          if [ "$FORCE" = "true" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "force_sync=true" >> $GITHUB_OUTPUT
            echo "Force mode enabled - forcing sync: $CURRENT_CLEAN -> $UPSTREAM_CLEAN"
          elif [ "$CURRENT_CLEAN" = "$UPSTREAM_CLEAN" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "force_sync=false" >> $GITHUB_OUTPUT
            echo "Versions match: $CURRENT_CLEAN = $UPSTREAM_CLEAN"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "force_sync=false" >> $GITHUB_OUTPUT
            echo "Update available: $CURRENT_CLEAN -> $UPSTREAM_CLEAN"
          fi

      - name: Check if release already exists
        id: check_release_exists
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_version.outputs.version }}"
          FORCE="${{ steps.compare_versions.outputs.force_sync }}"
          
          # Check if release already exists on GitHub
          if gh release view "${UPSTREAM_VERSION}" --repo ${{ env.EXIST_REPO }} >/dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

  sync-and-validate:
    name: Sync and Validate
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.has_update == 'true' && needs.check-upstream.outputs.is_stable == 'true' && (needs.check-upstream.outputs.release_exists == 'false' || needs.check-upstream.outputs.force_sync == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      merge_commit_sha: ${{ steps.merge_and_commit.outputs.sha }}
      sync_branch: ${{ steps.create_branch.outputs.branch_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/LeagueToolkit/ltk-manager.git || true
          git fetch upstream --tags --prune --force

      - name: Create sync branch
        id: create_branch
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          BRANCH_NAME="upstream-sync/${UPSTREAM_VERSION}"
          
          # Check if branch already exists
          if git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
            echo "Branch $BRANCH_NAME already exists, switching to it"
            git checkout $BRANCH_NAME
          else
            git checkout -b $BRANCH_NAME
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Checkout upstream release tag
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          git fetch upstream --tags --prune
          git checkout ${UPSTREAM_VERSION} -b upstream-tag-${UPSTREAM_VERSION}

      - name: Merge upstream release into sync branch
        id: merge_upstream
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          
          # Merge the upstream release tag
          git merge ${UPSTREAM_VERSION} --no-edit -m "chore: sync LTK upstream to ${UPSTREAM_VERSION}" || {
            echo "conflicts=true" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflicts detected - automatic resolution failed"
            exit 1
          }
          echo "conflicts=false" >> $GITHUB_OUTPUT

      - name: Handle merge conflicts
        if: ${{ steps.merge_upstream.outputs.conflicts == 'true' }}
        run: |
          echo "Merge conflicts detected - stopping workflow"
          echo "Manual resolution required"
          # List conflicting files
          git diff --name-only --diff-filter=U
          exit 1

      - name: Preserve Exist-specific files
        run: |
          # Ensure Exist-specific files are not overwritten
          # These files should not be modified by upstream merge
          git checkout HEAD -- src/lib/tauri.ts src/modules/shell/components/TitleBar.tsx src/pages/ExistSkinLibrary.tsx src/routes/skins.tsx src/routes/ltk.tsx src/lib/bindings/index.ts src/lib/bindings/exist/ src/lib/bindings/runeforge.ts src/modules/runeforge/ 2>/dev/null || true

      - name: Update Exist version references
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          UPSTREAM_CLEAN=${UPSTREAM_VERSION#v}
          
          # Update version in src-tauri/Cargo.toml
          CURRENT_VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CURRENT_VERSION" != "$UPSTREAM_CLEAN" ]; then
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$UPSTREAM_CLEAN\"/" src-tauri/Cargo.toml
            echo "Updated src-tauri/Cargo.toml version: $CURRENT_VERSION -> $UPSTREAM_CLEAN"
          fi
          
          # Update version in package.json
          PKG_CURRENT_VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PKG_CURRENT_VERSION" != "$UPSTREAM_CLEAN" ]; then
            sed -i "s/\"version\": \"$PKG_CURRENT_VERSION\"/\"version\": \"$UPSTREAM_CLEAN\"/" package.json
            echo "Updated package.json version: $PKG_CURRENT_VERSION -> $UPSTREAM_CLEAN"
          fi

      - name: Clean temporary files
        run: |
          # Remove any temporary/test files that shouldn't be committed
          rm -f test_server.* test_catalog_*.json test_catalog_from_server.json
          rm -f pnpm_test*.txt final_check*.txt test_output.txt final_validation.txt
          rm -f verify_catalog.* test_server.* download_catalog.*
          rm -rf .codegraph 2>/dev/null || true
          find . -name "*.tmp" -delete 2>/dev/null || true
          find . -name "*.log" -path "*/target/*" -delete 2>/dev/null || true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-4-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Regenerate lock files with updated versions
        run: |
          echo "Regenerating lock files with updated versions..."
          # Regenerate Cargo.lock
          cargo update --workspace
          # Regenerate pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
          echo "Lock files regenerated successfully"

      - name: Run Rust validation checks
        run: |
          echo "Running Rust validation checks..."
          cargo fmt --check
          cargo check --workspace
          cargo test --workspace

      - name: Run frontend validation checks
        run: |
          echo "Running frontend validation checks..."
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          pnpm lint
          pnpm test

      - name: Merge and commit
        id: merge_and_commit
        run: |
          git add -A
          # Check if there are any staged changes to commit
          if git diff --cached --quiet; then
            echo "No staged changes to commit, using existing HEAD"
            SHA=$(git rev-parse HEAD)
          else
            VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
            if git commit -m "chore: sync LTK upstream to $VERSION - validation passed"; then
              SHA=$(git rev-parse HEAD)
            else
              echo "Commit failed, using existing HEAD"
              SHA=$(git rev-parse HEAD)
            fi
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Push sync branch
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          BRANCH_NAME="upstream-sync/${UPSTREAM_VERSION}"
          git push origin $BRANCH_NAME --force

  auto-merge-and-release:
    name: Auto-Merge and Release
    needs: [check-upstream, sync-and-validate]
    if: ${{ needs.sync-and-validate.outputs.merge_commit_sha != '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.sync-and-validate.outputs.sync_branch }}

      - name: Verify merge commit
        run: |
          echo "Verifying merge commit: ${{ needs.sync-and-validate.outputs.merge_commit_sha }}"
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Windows)
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress || true
          refreshenv

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows executable
        run: |
          pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}

      - name: Verify build artifact
        run: |
          if (Test-Path "target/release/ltk-manager.exe") {
            Write-Host "EXE found at target/release/ltk-manager.exe"
            $EXE_SIZE = (Get-Item "target/release/ltk-manager.exe").Length
            Write-Host "EXE size: $EXE_SIZE bytes"
            
            $UPSTREAM_VERSION = "${{ needs.check-upstream.outputs.upstream_version }}"
            $UPSTREAM_CLEAN = $UPSTREAM_VERSION.TrimStart('v')
            Copy-Item "target/release/ltk-manager.exe" "target/release/Exist-Manager-v$UPSTREAM_CLEAN.exe" -Force
            Write-Host "EXE copied to Exist-Manager-v$UPSTREAM_CLEAN.exe"
          } else {
            Write-Host "ERROR: EXE not found at target/release/ltk-manager.exe"
            exit 1
          }
        shell: pwsh

      - name: Validate EXE version matches upstream
        run: |
          $UPSTREAM_VERSION = "${{ needs.check-upstream.outputs.upstream_version }}"
          $UPSTREAM_CLEAN = $UPSTREAM_VERSION.TrimStart('v')
          $EXE_PATH = "target/release/Exist-Manager-v$UPSTREAM_CLEAN.exe"
          
          Write-Host "=== VERSION VALIDATION ==="
          Write-Host "Expected version: $UPSTREAM_CLEAN"
          
          # Get EXE file version metadata
          $EXE_VERSION = (Get-Item $EXE_PATH).VersionInfo.FileVersion
          Write-Host "EXE FileVersion: $EXE_VERSION"
          
          # Get EXE product version
          $EXE_PRODUCT_VERSION = (Get-Item $EXE_PATH).VersionInfo.ProductVersion
          Write-Host "EXE ProductVersion: $EXE_PRODUCT_VERSION"
          
          # Verify version matches
          if ($EXE_VERSION -ne $UPSTREAM_CLEAN -and $EXE_PRODUCT_VERSION -ne $UPSTREAM_CLEAN) {
            Write-Host "ERROR: EXE version mismatch!"
            Write-Host "Expected: $UPSTREAM_CLEAN"
            Write-Host "FileVersion: $EXE_VERSION"
            Write-Host "ProductVersion: $EXE_PRODUCT_VERSION"
            exit 1
          }
          
          Write-Host "EXE version validation PASSED"
          
          # Also verify MSI and NSIS installer versions
          $MSI_PATH = "target/release/bundle/msi/Exist Manager_${UPSTREAM_CLEAN}_x64_en-US.msi"
          $NSIS_PATH = "target/release/bundle/nsis/Exist Manager_${UPSTREAM_CLEAN}_x64-setup.exe"
          
          if (Test-Path $MSI_PATH) {
            Write-Host "MSI found: $MSI_PATH"
          }
          if (Test-Path $NSIS_PATH) {
            Write-Host "NSIS found: $NSIS_PATH"
          }
          
          Write-Host "=== VERSION VALIDATION COMPLETE ==="
        shell: pwsh

      - name: Create/Update GitHub Release
        run: |
          $UPSTREAM_VERSION = "${{ needs.check-upstream.outputs.upstream_version }}"
          $UPSTREAM_CLEAN = $UPSTREAM_VERSION.TrimStart('v')
          $REPO = "existye4t/exist-lol-manager"
          $BRANCH = "upstream-sync/$UPSTREAM_VERSION"
          $TAG = "v$UPSTREAM_CLEAN"
          $EXE_PATH = "target/release/Exist-Manager-v$UPSTREAM_CLEAN.exe"
          $MSI_PATH = "target/release/bundle/msi/Exist Manager_${UPSTREAM_CLEAN}_x64_en-US.msi"
          $NSIS_PATH = "target/release/bundle/nsis/Exist Manager_${UPSTREAM_CLEAN}_x64-setup.exe"
          
          Write-Host "=== RELEASE CREATION ==="
          Write-Host "Tag: $TAG"
          Write-Host "Branch: $BRANCH"
          Write-Host "Repo: $REPO"
          
          # Push tag first
          git fetch --tags --prune --force
          git tag -f $TAG
          git push origin $TAG --force
          
          # Read release notes
          $NOTES_PATH = "docs/releases/$UPSTREAM_CLEAN.md"
          $NOTES = ""
          if (Test-Path $NOTES_PATH) {
            $NOTES = Get-Content $NOTES_PATH -Raw
          }
          
          # Create or update release using gh cli
          $RELEASE_ARGS = @(
            "release", "create", $TAG,
            "--title", "Exist Manager",
            "--target", $BRANCH,
            "--repo", $REPO
          )
          
          if ($NOTES) {
            $RELEASE_ARGS += "--notes", $NOTES
          }
          
          # Always use latest for now (can be adjusted)
          $RELEASE_ARGS += "--latest"
          
          # Add assets
          if (Test-Path $EXE_PATH) {
            $RELEASE_ARGS += $EXE_PATH
          }
          if (Test-Path $MSI_PATH) {
            $RELEASE_ARGS += $MSI_PATH
          }
          if (Test-Path $NSIS_PATH) {
            $RELEASE_ARGS += $NSIS_PATH
          }
          
          Write-Host "Running: gh $RELEASE_ARGS"
          gh $RELEASE_ARGS
          
          Write-Host "Release created/updated successfully"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Verify release
        run: |
          $UPSTREAM_VERSION = "${{ needs.check-upstream.outputs.upstream_version }}"
          $UPSTREAM_CLEAN = $UPSTREAM_VERSION.TrimStart('v')
          $TAG = "v$UPSTREAM_CLEAN"
          
          Write-Host "=== RELEASE VERIFICATION ==="
          Write-Host "Checking release $TAG on existye4t/exist-lol-manager"
          
          $RELEASE_INFO = gh release view $TAG --repo existye4t/exist-lol-manager --json assets,tagName,title,url
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Release not found!"
            exit 1
          }
          
          Write-Host "Release found:"
          Write-Host $RELEASE_INFO
          
          $ASSETS = $RELEASE_INFO | ConvertFrom-Json
          Write-Host "Assets:"
          $ASSETS.assets | ForEach-Object { Write-Host "  - $($_.name) ($($_.size) bytes)" }
          
          Write-Host "=== VERIFICATION COMPLETE ==="
        shell: pwsh

  notify-on-failure:
    name: Notify on Failure
    needs: [check-upstream, sync-and-validate, auto-merge-and-release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream auto-release failed: Upstream Sync & Auto Release',
              body: `The upstream auto-release workflow failed. Please check the workflow run for details.\n\nRun: ${github.server_url}/${github.repository}/actions/runs/${github.run_id}`,
              labels: ['upstream-sync', 'failure', 'auto-release']
            })